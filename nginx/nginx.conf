# Bootstrap config — HTTP only, used before SSL certificates are obtained.
# After running `make ssl-init`, replace this with nginx/nginx.conf.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name claim-agent.zarreh.ai;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 'Claim Agent — awaiting SSL certificate provisioning.';
            add_header Content-Type text/plain;
        }
    }
}
